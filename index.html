<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>國語報讀考卷｜學生版</title><style>
:root{font-family:'Microsoft JhengHei',sans-serif;color:#223346;background:#f0f5f6;font-size:20px}*{box-sizing:border-box}body{margin:0}header{background:#244a50;color:white;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{font-size:1.15rem;margin:0}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #a8c0c2;background:white;color:#173d42;border-radius:10px;padding:10px 14px}button:hover,button:focus-visible{outline:3px solid #f7d34d}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}nav button{white-space:nowrap}nav .active,.primary{background:#225e61;color:#fff}.card{background:white;border:1px solid #d6e3e3;border-radius:16px;padding:24px;box-shadow:0 3px 16px #3452}.intro{background:#edf7f2;border-left:5px solid #4b927f;padding:12px 16px;border-radius:8px}.speak{cursor:pointer;border-radius:4px}.speak:hover,.highlight{background:#fff235!important}h2{font-size:1.35rem}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,input,textarea{border:2px solid #bdcfd0;border-radius:8px;padding:8px;background:white}textarea{width:100%;min-height:90px}label{display:inline-flex;gap:6px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #abc;border-left:1px solid #abc}.vocab{min-height:125px;border-right:1px solid #abc;border-bottom:1px solid #abc;padding:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:1.35rem}.vocab small{font-size:.75rem;color:#51676c}.vocab .speak{display:inline-flex;align-items:center;gap:.18em;font-family:'DFKai-SB','BiauKai','PMingLiU',serif}.charbox{display:inline-flex;align-items:center;vertical-align:middle;gap:.22em;flex:none}.zhuyin{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;font-family:'DFKai-SB','標楷體','BiauKai',serif;font-size:.57em;line-height:1;letter-spacing:0;color:#30474b </style></head><body><header><div><h1>安東國小｜國語報讀考卷</h1><small>115 學年度第一學期第一次成績評量・A 組學生版</small></div><button onclick="document.querySelector('.settings').classList.toggle('open')">⚙ 報讀設定</button></header><main><div class="settings"><div class="controls"><label>報讀方式 <select id="mode"><option value="sentence">整句報讀</option><option value="word">單項報讀</option></select></label><label>聲音 <select id="voice"><option value="">系統預設中文聲音</option></select></label><label>語速 <select id="rate"><option value="0.7">慢速</option><option value="0.85" selected>稍慢</option><option value="1">一般</option><option value="1.2">稍快</option></select></label><button onclick="speechSynthesis.cancel()">停止報讀</button></div><p class="note">可選擇裝置提供的中文聲音，聲音及可用性依瀏覽器與裝置而異。點按題目或選項會以黃色標示並報讀。</p></div><nav id="nav"></nav><div class="controls"><label>姓名 <input id="name" placeholder="請輸入姓名"></label><span class="note">作答會暫存在這台裝置的瀏覽器。</span></div><section class="card" id="content"></section><div class="bottom"><button id="prev" onclick="go(page-1)">← 上一大題</button><button id="next" class="primary" onclick="go(page+1)">下一大題 →</button><button onclick="download()">交卷並下載答案</button></div><p class="note">生字請寫在紙本答案卷；交卷下載的檔案只包含電子作答內容。語音輸入需允許麥克風，建議使用 Chrome 或 Edge。</p></main><script>
const titles=['一、根據提示寫出完整的國字','二、造句','三、語詞填寫','四、成語填寫','五、課文文意理解','六、閱讀理解題組'];let page=0,chosen=null;let answers=JSON.parse(localStorage.getItem('antong-exam-a-v1')||'{}');const save=()=>localStorage.setItem('antong-exam-a-v1',JSON.stringify(answers));document.querySelector('#name').value=answers.name||'';document.querySelector('#name').oninput=e=>{answers.name=e.target.value;save()};
const vocab=[['淨','灘','ㄊㄢ',''],['年','邁','ㄇㄞˋ',''],['','灌','ㄍㄨㄢˋ','注'],['','賠','ㄆㄟˊ','償'],['謹','慎','ㄕㄣˋ',''],['師','傅','ㄈㄨˋ',''],['壁虎','釘','ㄉㄧㄥ',''],['','遞','ㄉㄧˋ','工具'],['口','碑','ㄅㄟ',''],['張燈結','綵','ㄘㄞˇ',''],['','橡','ㄒㄧㄤˋ','皮擦'],['','慚','ㄘㄢˊ','愧'],['','渲','ㄒㄩㄢˋ','染'],['煙','囪','ㄘㄨㄥ',''],['目','眩','ㄒㄩㄢˋ','神迷'],['','陡','ㄉㄡˇ','峭'],['','凹','ㄠ','凸不平'],['凹','凸','ㄊㄨˊ','不平'],['','綻','ㄓㄢˋ','放'],['','孵','ㄈㄨ','育']];
const fill3=['經過一整天緊張的運動會，大家都感到非常（　），回到家早早就休息了。','志工大隊在社區裡熱心（　）民眾，深獲大家的喜愛與感謝。','老師把解題步驟解釋得很（　），同學們一下子就聽懂了。','經過長時間的練習，小華對於這台機器的操作已經非常（　）了。','小明主動幫助體力不支的同學，大家紛紛開口（　）他的善行。'];const fill4=['太魯閣國家公園的奇岩壯谷景象（　），吸引了無數來自世界各地的遊客前來欣賞。','夜晚站在高山頂俯瞰園區，點點燈火（　），景象十分迷人。','這位新轉學來的同學長得（　），說話也很有禮貌，大家都非常喜歡他。','萬里長城綿延在崇山峻嶺之間，景觀（　），令人歎為觀止。','展覽館裡展示著各種珍貴的藝術作品，種類繁多，令人（　）。'];
const questions5=[['在《幸福筆記本》一文中，作者每天睡前記錄幸福筆記本的主要目的是什麼？',['記錄自己花費了多少費用','練習漂亮的書法與國字','提醒自己發現生活中的美好與感恩','為了寫成文章出版賣錢']],['在《做人做事做長久》一文中，冷氣機小技師裝完冷氣後主動拿掃把清掃地板、擦拭牆壁，這展現了何種態度？',['負責敬業的工作精神','想要向屋主多收取報酬','覺得自己技術不夠好而感到反思','為了拖延離開的時間']],['在《做人做事做長久》文中，小技師說：「顧客的好評是本店業績最大的保障」，這句話強調了什麼道理？',['做生意只要做一次就好','誠信與高品質服務能建立良好的長久名聲','宣傳廣告比服務品質更重要','工作效率越快越好，不必重視細節']],['在《孔雀錯了》一文中，故事裡的兩隻孔雀最後為什麼會失去美麗的尾巴？',['因為天氣太熱羽毛脫落','因為被獵人捕捉到了','因為彼此嫉妒對方，互相攻擊傷害','因為牠們沒有定期清洗羽毛']],['在《孔雀錯了》文中，作者聽完孔雀故事後低下頭，並與同學曹當玲相視而笑，這代表她們產生了什麼轉變？',['反思了自己的嫉妒心理，決定放下競爭、友好相處','覺得故事很好笑，想要取笑對方','決定以後不再參加作文與英文考試','覺得老師講得不對，心裡感到不服氣']],['在《特別的海》文中，宜蘭龜山島「牛奶海」呈現乳白色的主要成因是什麼？',['海上船隻不小心傾倒了大量的牛奶','陽光強烈照射產生的視覺錯覺','海水裡種植了許多的白色海草','底下火山噴發熱泉與海水反應產生白色物質']],['在《漫遊花東》文中，作者來到太魯閣燕子口，看見深谷、灰白岩石與奔流溪水，感受到了何種氣氛？',['熱鬧擁擠的市集氛圍','氣勢雄偉、讓人沉醉的自然美景','荒涼可怕的恐怖景象','平淡無奇的一般鄉村風景']],['在《護送螃蟹過馬路》一文中，發起「護蟹行動」的最主要目的是什麼？',['捕捉陸蟹來當作美味佳餚','阻斷道路不讓車輛通行','為了吸引大量遊客來觀光','協助抱卵陸蟹平安過馬路，維護生態平衡']]];
const passage='轉學生阿亮第一天來到新班級時，因為害羞而不敢主動開口。下課時，他總是獨自坐在座位上畫畫。班長小哲注意到阿亮畫的恐龍非常生動，便主動走過去讚美他：「你畫的恐龍真酷！我也很喜歡恐龍。」這句話讓阿亮眼睛一亮，兩人開心的聊了起來。後來，小哲還邀請阿亮一起加入小組討論，並鼓勵他在班級布告欄展示作品。在同學們的熱情陪伴下，阿亮漸漸放下了不安，露出了燦爛的笑容。阿亮體會到，一句簡單的善意與鼓勵，就像一道陽光，能給人帶來無比的勇氣與溫暖。';const questions6=[['阿亮第一天來到新班級時，為什麼獨自坐在座位上畫畫？',['因為他正在參加全國繪畫比賽','因為他害羞而不敢主動與同學開口','因為他不想理會其他同學','因為老師罰他留下來畫畫']],['小哲主動過去讚美阿亮的畫作，這對阿亮產生了什麼影響？',['讓阿亮感到非常生氣並離開教室','讓阿亮決定以後不再畫畫','讓阿亮覺得小哲在取笑他','開啟了兩人的話題，減輕阿亮的不安']],['故事中把「一句簡單的善意與鼓勵」比喻成什麼？',['一場突如其來的暴雨','一道給人勇氣與溫暖的陽光','一座高不可攀的山峰','一片浩瀚無邊的大海']],['班長小哲的行為展現了何種良好的品質？',['主動關懷他人與包容新同學的熱情態度','喜歡展示自己才能的驕傲態度','只跟認識的人玩耍的偏心態度','遇到困難就退縮的態度']],['如果你班上有新轉學來的同學，下列哪一種做法最符合本文傳達的精神？',['保持距離，等對方主動來找自己','取笑對方的害羞表現','主動招呼對方，並分享班上的好玩事情','完全忽視對方的存在']]];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function zhuyinMarkup(value){let chars=Array.from(value);let tone=/[ˊˇˋ˙]/.test(chars.at(-1)||'')?chars.pop():'';return chars.map((c,i)=>`<span class="zy-symbol">${esc(c)}${i===chars.length-1&&tone?`<span class="zy-tone">${esc(tone)}</span>`:''}</span>`).join('')}function spoken(s,whole=s){let parts=typeof Intl.Segmenter==='function'?[...new Intl.Segmenter('zh-TW',{granularity:'word'}).segment(s)].map(x=>x.segment):Array.from(s);return `<span class="speak" tabindex="0" data-speech="${esc(whole)}">${parts.map(x=>`<span class="word" data-speech="${esc(x)}">${esc(x)}</span>`).join('')}</span>`}function speak(el){document.querySelectorAll('.highlight').forEach(e=>e.classList.remove('highlight'));el.classList.add('highlight');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(el.dataset.speech||el.textContent);u.lang='zh-TW';u.rate=+document.querySelector('#rate').value;let v=speechSynthesis.getVoices().find(x=>x.name===document.querySelector('#voice').value);if(v)u.voice=v;speechSynthesis.speak(u)}document.addEventListener('click',e=>{let t=e.target.closest('.speak');if(t){let word=e.target.closest('.word');speak(document.querySelector('#mode').value==='word'&&word?word:t)}},true);document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('speak')){e.preventDefault();speak(e.target)}});function voices(){let v=document.querySelector('#voice');let old=v.value;v.innerHTML='<option value="">系統預設中文聲音</option>';speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('zh')).forEach(x=>v.add(new Option(x.name+'（'+x.lang+'）',x.name)));v.value=old}speechSynthesis.onvoiceschanged=voices;voices();
function go(n){page=Math.max(0,Math.min(5,n));chosen=null;render();window.scrollTo(0,0)}function setAns(key,value){answers[key]=value;save()}function chooseBlank(key){chosen=key;render()}function fill(word){if(chosen){setAns(chosen,word);render()}}function clearBlank(key){setAns(key,'');chosen=key;render()}function option(key,i){setAns(key,i);render()}function dict(key){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('這個瀏覽器不支援語音輸入，請改用 Chrome 或 Edge，或用鍵盤輸入。');return}let r=new R();r.lang='zh-TW';r.onresult=e=>{let t=document.getElementById(key);t.value+=(t.value?'，':'')+e.results[0][0].transcript;setAns(key,t.value)};r.onerror=e=>alert('語音輸入無法使用：'+e.error+'。請確認麥克風權限。');r.start()}
function fillPage(items,words,prefix){let bank=`<div class="bank" aria-label="語詞選項"><strong>語詞：</strong>${words.map(w=>`<button onclick="fill('${w}')" class="speak" data-speech="${w}">${w}</button>`).join('')}</div>`;let itemsHtml=items.map((s,i)=>{let k=prefix+i,parts=s.split('（　）');return `<div class="item">${i+1}．${spoken(parts[0],s.replace('（　）','空格'))} <button class="blank ${chosen===k?'chosen':''}" onclick="chooseBlank('${k}')">${esc(answers[k]||'點選空格')}</button> ${spoken(parts[1],s.replace('（　）','空格'))} <button class="trash" aria-label="清除第 ${i+1} 題答案" title="清除答案" onclick="clearBlank('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg></button></div>`}).join('');return '<p class="intro">先點題目中的空格，再點上方語詞；點垃圾桶可清除答案。</p>'+bank+itemsHtml}
function choicePage(items,prefix){return items.map((q,i)=>{let k=prefix+i;return `<div class="item"><div>${i+1}．<span class="blank">${answers[k]?['①','②','③','④'][answers[k]-1]:'　'}</span> ${spoken(q[0])}</div><div class="options">${q[1].map((o,j)=>`<button class="speak ${answers[k]===j+1?'selected':''}" data-speech="${esc(o)}" onclick="option('${k}',${j+1})">${['①','②','③','④'][j]} ${esc(o)}</button>`).join('')}</div></div>`}).join('')}
function render(){document.querySelector('#nav').innerHTML=titles.map((t,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${t}</button>`).join('');let html=`<h2>${titles[page]}</h2>`;if(page===0){html+='<p class="intro">每個字 1 分，共 20 分。點按語詞可以報讀；請依注音與字的提示，把完整國字寫在紙本答案卷。</p><div class="grid">'+vocab.map((v,i)=>`<div class="vocab"><small>${i+1}．</small><span class="speak" tabindex="0" data-speech="${i===16||i===17 ? '凹塗不平' : v[0]+v[1]+v[3]}">${v[0]}<span class="charbox"><span class="mask" aria-label="部分遮蔽的字"><span class="piece">${v[1]}</span></span><span class="zhuyin" aria-label="${v[2]}">${zhuyinMarkup(v[2])}</span></span>${v[3]}</span></div>`).join('')+'</div>'}if(page===1){html+='<p class="intro">每題 4 分，共 16 分。可打字，或按麥克風說出句子。</p>'+['即使……也……','只要……可以……','如果……那麼……','不是……而是……'].map((s,i)=>`<div class="item">${i+1}．${spoken(s)}<textarea id="sentence${i}" placeholder="請在這裡造句" oninput="setAns(this.id,this.value)">${esc(answers['sentence'+i]||'')}</textarea><button onclick="dict('sentence${i}')">🎙 語音輸入</button></div>`).join('')}if(page===2)html+=fillPage(fill3,['清楚','讚美','熟練','疲倦','服務'],'f3');if(page===3)html+=fillPage(fill4,['眉清目秀','星羅棋布','鬼斧神工','氣勢雄偉','目不暇給'],'f4');if(page===4)html+='<p class="intro">每題 3 分，共 24 分。點選選項，答案會顯示在題目上方的空格。</p>'+choicePage(questions5,'q5');if(page===5){let paragraphs=[passage.slice(0,passage.indexOf('班長小哲')),passage.slice(passage.indexOf('班長小哲'),passage.indexOf('後來，')),passage.slice(passage.indexOf('後來，'),passage.indexOf('在同學們')),passage.slice(passage.indexOf('在同學們'))];html+='<p class="intro">先點按文章報讀，再選擇答案。</p><div class="passage">'+paragraphs.map(p=>'<p>'+spoken(p)+'</p>').join('')+'</div>'+choicePage(questions6,'q6')}document.querySelector('#content').innerHTML=html;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===5}
function download(){let n=answers.name||'未填姓名';let lines=['安東國小 國語期中評量 A 組 學生版','姓名：'+n,'交卷時間：'+new Date().toLocaleString('zh-TW'),'','一、生字：請查看紙本答案卷。','','二、造句'];for(let i=0;i<4;i++)lines.push((i+1)+'．'+(answers['sentence'+i]||'未作答'));for(let p of ['f3','f4','q5','q6']){lines.push('',({'f3':'三、語詞填寫','f4':'四、成語填寫','q5':'五、課文文意理解','q6':'六、閱讀理解題組'})[p]);let count=p==='q5'?8:5;for(let i=0;i<count;i++)lines.push((i+1)+'．'+(answers[p+i]||'未作答'))}let blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='國語考卷答案_'+n.replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></body></html>
